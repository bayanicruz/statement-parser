[project]
name = "statement-parser"
version = "0.1.0"
description = "Extract transactions from credit card statement PDFs into Excel workbooks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Bayani Cruz" }]
keywords = ["bank", "statement", "pdf", "csv", "budget"]
dependencies = [
    "odfpy>=1.4.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.9",
]

[project.scripts]
statement-parser = "statements:main"
transaction-tracker = "transaction:main"
transaction-tracker-pdf = "transaction_v2:main"
